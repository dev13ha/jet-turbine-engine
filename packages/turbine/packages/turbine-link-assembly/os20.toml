# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/turbine-link-assembly"
version = "1.0.1"
edition = "2026"
description = "component package @turbine-engine/turbine-link-assembly version 1.0.0. Geometry files: Turbine Link Assembly- JET v2.stl. Source filename contains Assembly. No child parts were identified, so this remains a leaf and does not replace @turbine-engine/turbine-link."

