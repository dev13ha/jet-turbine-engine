# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/turbine-fan-6"
version = "1.0.1"
edition = "2026"
description = "component package @turbine-engine/turbine-fan-6 version 1.0.0. Geometry files: Turbine Fan-6- JET v2.stl."

[language]
kerml = "1.0"
sysml = "2.0"

[[artifacts]]
name = "behavior-turbinefan6"
kind = "behavior"
format = "scxml"

[artifacts.semantic]
relation = "core:simulates"
target = "os20:@turbine-engine/turbine-fan-6"

