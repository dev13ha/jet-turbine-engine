# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/turbine"
version = "1.0.1"
edition = "2026"
description = "assembly package @turbine-engine/turbine version 1.0.0. Geometry files: Turbine Assembly- JET v9.stl."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@turbine-engine/turbine-shaft" = "@turbine-engine/turbine-shaft@^1.0.0"
"@turbine-engine/turbine-housing" = "@turbine-engine/turbine-housing@^1.0.0"
"@turbine-engine/turbine-fan-1" = "@turbine-engine/turbine-fan-1@^1.0.0"
"@turbine-engine/turbine-fan-2" = "@turbine-engine/turbine-fan-2@^1.0.0"
"@turbine-engine/turbine-fan-3" = "@turbine-engine/turbine-fan-3@^1.0.0"
"@turbine-engine/turbine-fan-4" = "@turbine-engine/turbine-fan-4@^1.0.0"
"@turbine-engine/turbine-fan-5" = "@turbine-engine/turbine-fan-5@^1.0.0"
"@turbine-engine/turbine-fan-6" = "@turbine-engine/turbine-fan-6@^1.0.0"
"@turbine-engine/turbine-spacer-1" = "@turbine-engine/turbine-spacer-1@^1.0.0"
"@turbine-engine/turbine-spacer-2" = "@turbine-engine/turbine-spacer-2@^1.0.0"
"@turbine-engine/turbine-link" = "@turbine-engine/turbine-link@^1.0.0"
"@turbine-engine/turbine-link-assembly" = "@turbine-engine/turbine-link-assembly@^1.0.0"

[[artifacts]]
name = "assembly-os20"
kind = "assembly"
format = "yaml"

[artifacts.semantic]
relation = "core:describes"
target = "os20:@turbine-engine/turbine"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "master"
path = "packages/turbine/assembly.os20.yaml"

[[artifacts]]
name = "behavior-turbine"
kind = "behavior"
format = "scxml"

[artifacts.semantic]
relation = "core:simulates"
target = "os20:@turbine-engine/turbine"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "master"
path = "packages/turbine/behavior/Turbine.scxml"

[[artifacts]]
name = "behavior-turbineassemblyjetv9"
kind = "behavior"
format = "scxml"

[artifacts.semantic]
relation = "core:simulates"
target = "os20:@turbine-engine/turbine"

[artifacts.source]
provider = "github"
