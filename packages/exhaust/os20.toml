# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@jet/exhaust"
version = "1.0.0"
edition = "2026"
description = "assembly package @jet/exhaust version 1.0.0."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@jet/flare-base" = "@jet/flare-base@^1.0.0"
"@jet/flare-lever-1" = "@jet/flare-lever-1@^1.0.0"
"@jet/flare-lever-2" = "@jet/flare-lever-2@^1.0.0"
"@jet/flare-lever-3" = "@jet/flare-lever-3@^1.0.0"
