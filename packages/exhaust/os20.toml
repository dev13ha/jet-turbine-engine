# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/exhaust"
version = "1.0.1"
edition = "2026"
description = "assembly package @turbine-engine/exhaust version 1.0.0."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@turbine-engine/flare-base" = "@turbine-engine/flare-base@^1.0.0"
"@turbine-engine/flare-lever-1" = "@turbine-engine/flare-lever-1@^1.0.0"
"@turbine-engine/flare-lever-2" = "@turbine-engine/flare-lever-2@^1.0.0"
"@turbine-engine/flare-lever-3" = "@turbine-engine/flare-lever-3@^1.0.0"

[[artifacts]]
name = "assembly-os20"
kind = "assembly"
format = "yaml"

[artifacts.semantic]
relation = "core:describes"
target = "os20:@turbine-engine/exhaust"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "1c0e0443213cfdabc38cb68b52196bd23a0c4481"
path = "packages/exhaust/assembly.os20.yaml"

