# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/main-axis"
version = "1.0.1"
edition = "2026"
description = "assembly package @turbine-engine/main-axis version 1.0.0. Geometry files: Main Axis Assembly v11.stl."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@turbine-engine/main-axis-shaft" = "@turbine-engine/main-axis-shaft@^1.0.0"
"@turbine-engine/bearing-1" = "@turbine-engine/bearing-1@^1.0.0"
"@turbine-engine/bearing-2" = "@turbine-engine/bearing-2@^1.0.0"
"@turbine-engine/turbine-axis-spacer" = "@turbine-engine/turbine-axis-spacer@^1.0.0"

[[artifacts]]
name = "assembly-os20"
kind = "assembly"
format = "yaml"

[artifacts.semantic]
relation = "core:describes"
target = "os20:@turbine-engine/main-axis"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "master"
path = "packages/main-axis/assembly.os20.yaml"

[[artifacts]]
name = "behavior-mainaxis"
kind = "behavior"
format = "scxml"

[artifacts.semantic]
relation = "core:simulates"
target = "os20:@turbine-engine/main-axis"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "master"
path = "packages/main-axis/behavior/MainAxis.scxml"

