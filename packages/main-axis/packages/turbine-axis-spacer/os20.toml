# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/turbine-axis-spacer"
version = "1.0.1"
edition = "2026"
description = "component package @turbine-engine/turbine-axis-spacer version 1.0.0. Geometry files: Turbine Axis Spacer- JET v2.stl."

[language]
kerml = "1.0"
sysml = "2.0"

[[artifacts]]
name = "behavior-turbineaxisspacer"
kind = "behavior"
format = "scxml"

[artifacts.semantic]
relation = "core:simulates"
target = "os20:@turbine-engine/turbine-axis-spacer"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "master"
path = "packages/main-axis/packages/turbine-axis-spacer/behavior/TurbineAxisSpacer.scxml"

