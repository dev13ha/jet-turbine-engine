# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@jet/compressor"
version = "1.0.0"
edition = "2026"
description = "assembly package @jet/compressor version 1.0.0."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@jet/front-compressor" = "@jet/front-compressor@^1.0.0"
"@jet/mid-compressor" = "@jet/mid-compressor@^1.0.0"
"@jet/rear-compressor" = "@jet/rear-compressor@^1.0.0"
