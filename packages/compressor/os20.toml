# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/compressor"
version = "1.0.1"
edition = "2026"
description = "assembly package @turbine-engine/compressor version 1.0.0."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@turbine-engine/front-compressor" = "@turbine-engine/front-compressor@^1.0.0"
"@turbine-engine/mid-compressor" = "@turbine-engine/mid-compressor@^1.0.0"
"@turbine-engine/rear-compressor" = "@turbine-engine/rear-compressor@^1.0.0"

[[artifacts]]
name = "assembly-os20"
kind = "assembly"
format = "yaml"

[artifacts.semantic]
relation = "core:describes"
target = "os20:@turbine-engine/compressor"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "1c0e0443213cfdabc38cb68b52196bd23a0c4481"
path = "packages/compressor/assembly.os20.yaml"

[[artifacts]]
name = "behavior-compressor"
kind = "behavior"
format = "scxml"

[artifacts.semantic]
relation = "core:simulates"
target = "os20:@turbine-engine/compressor"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "1c0e0443213cfdabc38cb68b52196bd23a0c4481"
path = "packages/compressor/behavior/Compressor.scxml"

[[artifacts]]
name = "materials-compressor"
kind = "materials"
format = "toml"

[artifacts.semantic]
relation = "core:specifies"
target = "os20:@turbine-engine/compressor"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "1c0e0443213cfdabc38cb68b52196bd23a0c4481"
path = "packages/compressor/materials/Compressor.toml"

[[artifacts]]
name = "model-compressor"
kind = "model"
format = "sysml"

[artifacts.semantic]
relation = "core:describes"
target = "os20:@turbine-engine/compressor"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "1c0e0443213cfdabc38cb68b52196bd23a0c4481"
