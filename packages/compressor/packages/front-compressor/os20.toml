"@turbine-engine/front-compression-fan-3" = "@turbine-engine/front-compression-fan-3@^1.0.0"
"@turbine-engine/front-compression-fan-4" = "@turbine-engine/front-compression-fan-4@^1.0.0"

[[artifacts]]
name = "assembly-os20"
kind = "assembly"
format = "yaml"

[artifacts.semantic]
relation = "core:describes"
target = "os20:@turbine-engine/front-compressor"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "1c0e0443213cfdabc38cb68b52196bd23a0c4481"
path = "packages/compressor/packages/front-compressor/assembly.os20.yaml"

[[artifacts]]
name = "behavior-frontcompressor"
kind = "behavior"
