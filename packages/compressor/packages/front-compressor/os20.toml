# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/front-compressor"
version = "1.0.1"
edition = "2026"
description = "assembly package @turbine-engine/front-compressor version 1.0.0."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@turbine-engine/front-compression-cap" = "@turbine-engine/front-compression-cap@^1.0.0"
"@turbine-engine/front-compression-hub" = "@turbine-engine/front-compression-hub@^1.0.0"
"@turbine-engine/front-compression-fan-1" = "@turbine-engine/front-compression-fan-1@^1.0.0"
