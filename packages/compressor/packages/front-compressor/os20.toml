# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@jet/front-compressor"
version = "1.0.0"
edition = "2026"
description = "assembly package @jet/front-compressor version 1.0.0."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@jet/front-compression-cap" = "@jet/front-compression-cap@^1.0.0"
"@jet/front-compression-hub" = "@jet/front-compression-hub@^1.0.0"
"@jet/front-compression-fan-1" = "@jet/front-compression-fan-1@^1.0.0"
"@jet/front-compression-fan-2" = "@jet/front-compression-fan-2@^1.0.0"
"@jet/front-compression-fan-3" = "@jet/front-compression-fan-3@^1.0.0"
"@jet/front-compression-fan-4" = "@jet/front-compression-fan-4@^1.0.0"
