# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/rear-compression-hub"
version = "1.0.1"
edition = "2026"
description = "component package @turbine-engine/rear-compression-hub version 1.0.0. Geometry files: Rear Compression Hub - JET v5.stl."

[language]
kerml = "1.0"
sysml = "2.0"

