# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/mid-compression-shaft"
version = "1.0.1"
edition = "2026"
description = "component package @turbine-engine/mid-compression-shaft version 1.0.0. Geometry files: Mid Compression Shaft- JET v3.stl."

[language]
kerml = "1.0"
sysml = "2.0"

[[artifacts]]
name = "behavior-midcompressionshaft"
kind = "behavior"
format = "scxml"

[artifacts.semantic]
relation = "core:simulates"
target = "os20:@turbine-engine/mid-compression-shaft"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "master"
path = "packages/compressor/packages/mid-compressor/packages/mid-compression-shaft/behavior/MidCompressionShaft.scxml"

