# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/mid-compressor"
version = "1.0.0"
edition = "2026"
description = "assembly package @turbine-engine/mid-compressor version 1.0.0. Geometry files: Mid Compression Assembly - JET v4.stl."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@turbine-engine/mid-compression-cap" = "@turbine-engine/mid-compression-cap@^1.0.0"
"@turbine-engine/mid-compression-fan" = "@turbine-engine/mid-compression-fan@^1.0.0"
"@turbine-engine/mid-compression-link" = "@turbine-engine/mid-compression-link@^1.0.0"
"@turbine-engine/mid-compression-shaft" = "@turbine-engine/mid-compression-shaft@^1.0.0"
"@turbine-engine/mid-axis-cover" = "@turbine-engine/mid-axis-cover@^1.0.0"
