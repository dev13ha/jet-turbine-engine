# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/combustion-system"
version = "1.0.0"
edition = "2026"
description = "assembly package @turbine-engine/combustion-system version 1.0.0. Geometry files: Combustion Chamber Assembly- JET v4.stl. Combustion Chamber Assembly is attached here as reference geometry for the combustion assembly. It does not replace the combustion child packages."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@turbine-engine/combustion-casing" = "@turbine-engine/combustion-casing@^1.0.0"
"@turbine-engine/combustion-chamber" = "@turbine-engine/combustion-chamber@^1.0.0"
"@turbine-engine/combustion-c-ring" = "@turbine-engine/combustion-c-ring@^1.0.0"
"@turbine-engine/combustion-shell" = "@turbine-engine/combustion-shell@^1.0.0"
"@turbine-engine/combustion-cap" = "@turbine-engine/combustion-cap@^1.0.0"
"@turbine-engine/combustion-stage" = "@turbine-engine/combustion-stage@^1.0.0"
"@turbine-engine/fuel-port-cap" = "@turbine-engine/fuel-port-cap@^1.0.0"
