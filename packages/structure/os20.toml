# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/structure"
version = "1.0.1"
edition = "2026"
description = "assembly package @turbine-engine/structure version 1.0.0."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@turbine-engine/rear-casing" = "@turbine-engine/rear-casing@^1.0.0"
"@turbine-engine/core-plate" = "@turbine-engine/core-plate@^1.0.0"
"@turbine-engine/heat-ring" = "@turbine-engine/heat-ring@^1.0.0"
"@turbine-engine/rivet-2x4" = "@turbine-engine/rivet-2x4@^1.0.0"

[[artifacts]]
name = "assembly-os20"
kind = "assembly"
format = "yaml"

[artifacts.semantic]
relation = "core:describes"
target = "os20:@turbine-engine/structure"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "master"
path = "packages/structure/assembly.os20.yaml"

[[artifacts]]
name = "behavior-structure"
kind = "behavior"
format = "scxml"

[artifacts.semantic]
relation = "core:simulates"
target = "os20:@turbine-engine/structure"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "master"
path = "packages/structure/behavior/Structure.scxml"

[[artifacts]]
name = "materials-structure"
kind = "materials"
format = "toml"

[artifacts.semantic]
relation = "core:specifies"
target = "os20:@turbine-engine/structure"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "master"
path = "packages/structure/materials/Structure.toml"

[[artifacts]]
name = "model-structure"
kind = "model"
format = "sysml"

[artifacts.semantic]
relation = "core:describes"
target = "os20:@turbine-engine/structure"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "master"
path = "packages/structure/model/Structure.sysml"
