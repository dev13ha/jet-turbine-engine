# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@jet/structure"
version = "1.0.0"
edition = "2026"
description = "assembly package @jet/structure version 1.0.0."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@jet/rear-casing" = "@jet/rear-casing@^1.0.0"
"@jet/core-plate" = "@jet/core-plate@^1.0.0"
"@jet/heat-ring" = "@jet/heat-ring@^1.0.0"
"@jet/rivet-2x4" = "@jet/rivet-2x4@^1.0.0"
