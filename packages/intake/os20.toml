# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@jet/intake"
version = "1.0.0"
edition = "2026"
description = "assembly package @jet/intake version 1.0.0."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@jet/nose-cone" = "@jet/nose-cone@^1.0.0"
"@jet/intake-casing" = "@jet/intake-casing@^1.0.0"
"@jet/intake-structure" = "@jet/intake-structure@^1.0.0"
"@jet/intake-fan" = "@jet/intake-fan@^1.0.0"
