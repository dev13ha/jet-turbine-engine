# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/intake"
version = "1.0.0"
edition = "2026"
description = "assembly package @turbine-engine/intake version 1.0.0."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@turbine-engine/nose-cone" = "@turbine-engine/nose-cone@^1.0.0"
"@turbine-engine/intake-casing" = "@turbine-engine/intake-casing@^1.0.0"
"@turbine-engine/intake-structure" = "@turbine-engine/intake-structure@^1.0.0"
"@turbine-engine/intake-fan" = "@turbine-engine/intake-fan@^1.0.0"
