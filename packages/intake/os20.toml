revision = "1c0e0443213cfdabc38cb68b52196bd23a0c4481"
path = "packages/intake/materials/Intake.toml"

[[artifacts]]
name = "model-intake"
kind = "model"
format = "sysml"

[artifacts.semantic]
relation = "core:describes"
target = "os20:@turbine-engine/intake"

