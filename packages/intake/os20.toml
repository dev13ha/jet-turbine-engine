# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/intake"
version = "1.0.1"
edition = "2026"
description = "assembly package @turbine-engine/intake version 1.0.0."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@turbine-engine/nose-cone" = "@turbine-engine/nose-cone@^1.0.0"
"@turbine-engine/intake-casing" = "@turbine-engine/intake-casing@^1.0.0"
"@turbine-engine/intake-structure" = "@turbine-engine/intake-structure@^1.0.0"
"@turbine-engine/intake-fan" = "@turbine-engine/intake-fan@^1.0.0"

[[artifacts]]
name = "assembly-os20"
kind = "assembly"
format = "yaml"

[artifacts.semantic]
relation = "core:describes"
target = "os20:@turbine-engine/intake"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "1c0e0443213cfdabc38cb68b52196bd23a0c4481"
path = "packages/intake/assembly.os20.yaml"

[[artifacts]]
name = "behavior-intake"
kind = "behavior"
format = "scxml"

[artifacts.semantic]
relation = "core:simulates"
target = "os20:@turbine-engine/intake"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "1c0e0443213cfdabc38cb68b52196bd23a0c4481"
path = "packages/intake/behavior/Intake.scxml"

[[artifacts]]
name = "materials-intake"
kind = "materials"
format = "toml"

[artifacts.semantic]
relation = "core:specifies"
target = "os20:@turbine-engine/intake"

