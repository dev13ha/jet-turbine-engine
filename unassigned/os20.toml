# Holding package for dataset files that were not confidently assigned.
# This package is not a dependency of @turbine-engine/turbine-engine.
# UNKNOWN assignment is not a pass.

[package]
name = "@turbine-engine/unassigned-source"
version = "1.0.1"
edition = "2026"
description = "Source CAD files from the turbine dataset that could not be assigned to the requested product tree. Not an engine subsystem."

[language]
kerml = "1.0"
sysml = "2.0"

[[artifacts]]
name = "behavior-blade1jetv2"
kind = "behavior"
format = "scxml"

[artifacts.semantic]
relation = "core:simulates"
target = "os20:@turbine-engine/unassigned-source"

