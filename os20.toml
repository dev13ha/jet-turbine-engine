# OS20 package manifest (os20.toml). This is the package identity.
# [dependencies] is dependsOn. It is not physical containment.
# Physical membership is assembly.os20.yaml when this package is an assembly.

[package]
name = "@turbine-engine/turbine-engine"
version = "1.0.1"
edition = "2026"
description = "assembly package @turbine-engine/turbine-engine version 1.0.0. Geometry files: Working.stl, Open.stl, Open.skp."

[language]
kerml = "1.0"
sysml = "2.0"

[dependencies]
"@turbine-engine/intake" = "@turbine-engine/intake@^1.0.0"
"@turbine-engine/compressor" = "@turbine-engine/compressor@^1.0.0"
"@turbine-engine/combustion-system" = "@turbine-engine/combustion-system@^1.0.0"
"@turbine-engine/main-axis" = "@turbine-engine/main-axis@^1.0.0"
"@turbine-engine/turbine" = "@turbine-engine/turbine@^1.0.0"
"@turbine-engine/exhaust" = "@turbine-engine/exhaust@^1.0.0"
"@turbine-engine/structure" = "@turbine-engine/structure@^1.0.0"

[[artifacts]]
name = "assembly-os20"
kind = "assembly"
format = "yaml"

[artifacts.semantic]
relation = "core:describes"
target = "os20:@turbine-engine/turbine-engine"

[artifacts.source]
provider = "github"
repo = "dev13ha/jet-turbine-engine"
revision = "1c0e0443213cfdabc38cb68b52196bd23a0c4481"
path = "assembly.os20.yaml"

